name: EtherCAT firmware CI
on:
  push:
    branches: [ethercat]
  pull_request:
    branches: [ethercat]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ethercat-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          path: dust-adapter
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gperf device-tree-compiler xz-utils
          python -m pip install west==1.3.0
      - name: Install Zephyr SDK
        env:
          SDK_VERSION: 0.16.8
        run: |
          cd "$RUNNER_TEMP"
          base="https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v${SDK_VERSION}"
          archive="zephyr-sdk-${SDK_VERSION}_linux-x86_64_minimal.tar.xz"
          curl --fail --location --retry 3 -O "$base/$archive"
          curl --fail --location --retry 3 -o sha256.sum "$base/sha256.sum"
          grep " $archive\$" sha256.sum | sha256sum --check
          tar xf "$archive"
          cd "zephyr-sdk-${SDK_VERSION}"
          ./setup.sh -t riscv64-zephyr-elf -c
          echo "ZEPHYR_SDK_INSTALL_DIR=$PWD" >> "$GITHUB_ENV"
          echo 'ZEPHYR_TOOLCHAIN_VARIANT=zephyr' >> "$GITHUB_ENV"
      - name: Build EtherCAT slave firmware
        run: bash dust-adapter/scripts/ci_build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: dust-adapter-ethercat-${{ github.sha }}
          path: dust-adapter/dist/
          if-no-files-found: error
          retention-days: 30
