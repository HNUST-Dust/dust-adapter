name: USB firmware CI and release
on:
  push:
    branches: [main, usb, feature/generic-usb-adapter]
    tags: ['v*']
  pull_request:
    branches: [main, usb, feature/generic-usb-adapter]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          path: dust-adapter
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gperf device-tree-compiler xz-utils
          python -m pip install west==1.3.0
      - name: Install Zephyr SDK
        env:
          SDK_VERSION: 0.16.8
        run: |
          cd "$RUNNER_TEMP"
          base="https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v${SDK_VERSION}"
          archive="zephyr-sdk-${SDK_VERSION}_linux-x86_64_minimal.tar.xz"
          curl --fail --location --retry 3 -O "$base/$archive"
          curl --fail --location --retry 3 -o sha256.sum "$base/sha256.sum"
          grep " $archive\$" sha256.sum | sha256sum --check
          tar xf "$archive"
          cd "zephyr-sdk-${SDK_VERSION}"
          ./setup.sh -t riscv64-zephyr-elf -c
          echo "ZEPHYR_SDK_INSTALL_DIR=$PWD" >> "$GITHUB_ENV"
          echo 'ZEPHYR_TOOLCHAIN_VARIANT=zephyr' >> "$GITHUB_ENV"
      - name: Test generic wire and session contracts
        run: bash dust-adapter/scripts/test_protocol.sh
      - name: Build production USB firmware
        run: bash dust-adapter/scripts/ci_build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: dust-adapter-usb-${{ github.sha }}
          path: dust-adapter/dist/
          if-no-files-found: error
          retention-days: 30
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dust-adapter-usb-${{ github.sha }}
          path: firmware
      - name: Publish USB release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          tar -czf dust-adapter-usb-${TAG}.tar.gz -C firmware .
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --title "${TAG} — USB gateway" --notes "Production USB Bulk gateway for dust-hpm6750. CAN/UART/IMU forwarding; no chassis algorithm. Built by GitHub Actions. Hardware flashing is manual."
          fi
          gh release upload "$TAG" dust-adapter-usb-${TAG}.tar.gz firmware/dust-adapter-usb.bin firmware/dust-adapter-usb.elf firmware/SHA256SUMS --clobber
