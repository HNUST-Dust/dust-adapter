CONFIG_BOOT_BANNER=n
CONFIG_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=n
CONFIG_STDOUT_CONSOLE=n
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=16384
CONFIG_LOG=n
CONFIG_REBOOT=n
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_HEAP_MEM_POOL_SIZE=4096
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_HPM_ESC=y
# Aligned PDRAM transfers; set n for the original byte-access comparison.
CONFIG_HPM_ESC_PDRAM_WORD_ACCESS=y

# Keep the first SSC bring-up simple. DC/SYNC interrupts are not required for
# the FreeRun DTC1 gateway test.
CONFIG_ISR_STACK_SIZE=4096

# Adapter firmware has no local filesystem or FatFs dependency.
CONFIG_FILE_SYSTEM=n

# HPM5E31 板载 IMU 使用 SPI3 采集原始突发（加热输出仍关闭）。
CONFIG_PWM=y
CONFIG_BUZZER=y
CONFIG_SPI=y
CONFIG_SPI_ASYNC=y
CONFIG_DMA=y
CONFIG_SPI_HPM_SPI_DMA=y
CONFIG_ONBOARD_IMU_RAW=y

# DTC1 协议核心与 SSC 应用适配使用 C++17。
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_REQUIRES_FULL_LIBCPP=y

# 5E31 使用原生 RX idle 发布部分 DMA 缓冲区；后端统一配置 1 ms idle 并启动业务端口。
CONFIG_UART_ASYNC_API=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_HPMICRO_RX_NATIVE_IDLE=y

# 后端需要动态配置 DBUS 8E2，并用预留 Flash 区保存跨上电启动计数。
CONFIG_UART_USE_RUNTIME_CONFIGURE=y
CONFIG_NVS=y
CONFIG_NVS_DATA_CRC=y
CONFIG_SYS_CLOCK_TICKS_PER_SEC=10000
# HPM 启动头仍从 Flash 0 开始；链接区止于 0xd0000，避免代码增长覆盖 NVS/诊断区。
CONFIG_ROM_END_OFFSET=0x30000

# NVS 扫描及 ROM Flash 调用也在主线程，启用栈边界检测。
CONFIG_STACK_SENTINEL=y
CONFIG_INIT_STACKS=y

# The SSC owner, CAN transmit, IMU acquisition and HI91 parser use bounded workers.
CONFIG_MAIN_THREAD_PRIORITY=0
CONFIG_THREAD_NAME=y

# DTG1 uses SM2 synchronization and complete latest device snapshots.
# Preserve byte-equivalent publication optimization with the table digest.

# Board outputs: buzzer is already enabled; add the IMU heater PID loop.
# The heater runs at 20 ms with a 45 C target (see the PID constants below).
CONFIG_GPIO=y
CONFIG_BOARD_OUTPUTS=y
CONFIG_IMU_HEATER_ENABLE=y
CONFIG_IMU_TARGET_C=45
CONFIG_IMU_HEATER_KP_MILLI=100
CONFIG_IMU_HEATER_KI_MILLI=20
CONFIG_IMU_HEATER_KD_MILLI=0
CONFIG_IMU_HEATER_MAX_PERMILLE=1000
CONFIG_IMU_HEATER_PERIOD_MS=10

# DTG1 release runtime. Test counters require an explicit acceptance overlay.
CONFIG_ECAT_UART_RX_DMA_BYTES=128
CONFIG_ECAT_UART2_IDLE_US=80
