CONFIG_BOOT_BANNER=n
CONFIG_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=n
CONFIG_STDOUT_CONSOLE=n
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=16384
CONFIG_LOG=n
CONFIG_REBOOT=n
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=4096
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_HPM_ESC=y

# Keep the first SSC bring-up simple. DC/SYNC interrupts are not required for
# the FreeRun DTC1 gateway test.
CONFIG_ISR_STACK_SIZE=4096

# Adapter firmware has no local filesystem or FatFs dependency.
CONFIG_FILE_SYSTEM=n

# HPM5E31 首版暂时不初始化 SPI IMU（板级默认同时关闭加热输出）。
CONFIG_SPI=n

# DTC1 协议核心与 SSC 应用适配使用 C++17。
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_REQUIRES_FULL_LIBCPP=y
